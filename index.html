.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin-top:12px}
.fx{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.35);animation:up .9s ease-out forwards;z-index:5}

.bit{position:absolute;pointer-events:none;animation:fly .9s ease-out forwards;z-index:4}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.rain{position:absolute;top:-30px;pointer-events:none;animation:fall 2.4s linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(560px) rotate(360deg)}}
#gold{position:absolute;z-index:6;border:0;background:none;font-size:2.6rem;cursor:pointer;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.25) rotate(12deg)}}
.shop{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:14px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}

#list{display:grid;gap:8px;overflow-y:auto;max-height:62vh;padding-right:2px}
.item{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;width:100%}
.item:hover:not(.cant){border-color:var(--ok)}
.item.cant{opacity:var(--cant);cursor:not-allowed}
.item.done{border-color:var(--ok)}
.item .e{font-size:1.9rem;width:2.2rem;text-align:center}
.item b{display:block;font-weight:600}
.item small{color:var(--mut);display:block;font-size:.8rem}
.item .c{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.item .n{color:var(--mut);font-size:.8rem;font-weight:400;display:block}
.foot{margin-top:10px;display:flex;gap:8px;justify-content:space-between;color:var(--mut);font-size:.8rem}
.foot button{font:inherit;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.s{opacity:1}
.tabs{flex-wrap:wrap}.tabs button{min-width:22%;font-size:.85rem;padding:8px 4px}

.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}

.qty{display:flex;gap:6px;margin-bottom:8px}.qty[hidden]{display:none}.qty button{flex:1;font:inherit;padding:6px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}.qty button.on{border-color:var(--ok);color:var(--ok);font-weight:600}
.ap select,.ap textarea{width:100%;font:inherit;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}.ap h3{margin:10px 0 6px;font-size:.95rem}
#thm{font-size:1rem;text-decoration:none!important}
#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:16px;overflow-y:auto}#auth[hidden]{display:none}

</style>
</head>

</div>

function rAch(){const t=S.pt||0;$('list').innerHTML=`<div class='box'>Temps de jeu : <b>${Math.floor(t/3600)} h ${Math.floor(t%3600/60)} min</b> · Clics : <b>${f(S.ck)}</b> · Total gagné : <b>${f(S.tot)}</b> · Rebirths : <b>${S.rb}</b> · Quêtes : <b>${S.qd||0}</b> · Série : <b>${S.stk||0} j</b><br>Chaque succès donne +2 % de gains. Débloqués : <b>${achN()}/${ACH.length}</b></div>`+ACH.map((a,i)=>`<div class='ach${S.ach[i]?' ok':''}'><span class='e'>${S.ach[i]?a[1]:'🔒'}</span><b>${a[0]}</b></div>`).join('')}
Object.assign(AD,{login:()=>{if(Date.now()<lockT){toast('Trop d’essais, patiente '+Math.ceil((lockT-Date.now())/1000)+' s');return false}const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(u==='admin'&&hs(p)===(S.apw||hs('clicker'))){admIn=true;fails=0;toast('Connecté ✔');openAdmin();return false}fails++;if(fails>=3){lockT=Date.now()+30000;fails=0}toast('Identifiants incorrects');return false},pw:()=>{const v=$('np').value;if(v.length<4){toast('4 caractères minimum');return false}S.apw=hs(v);$('np').value='';toast('Mot de passe changé ✔');return false},out:()=>{admIn=false;$('adm').hidden=true;return false},pets:()=>{PETS.forEach(p=>S.pets[p.id]=1)},qdone:()=>{S.q=S.q.map(q=>({...q,base:q.base-q.goal}))},mk:()=>{const c=$('ac').value.trim().toUpperCase();if(!c){toast('Donne un nom au code');return false}S.cust=S.cust||{};S.cust[c]=Math.max(1,Number($('ax').value)||1);toast('Code '+c+' créé (+'+f(S.cust[c])+')');return false}});
function openAdmin(){const a=$('adm');if(admIn)return openAdminPanel();a.hidden=false;a.firstElementChild.innerHTML=`<h2>🔐 Connexion admin</h2><div class='box'>Accès réservé. Identifiant et mot de passe requis.</div><input id='lu' placeholder='Identifiant' autocomplete='off' aria-label='Identifiant'><input id='lp' type='password' placeholder='Mot de passe' aria-label='Mot de passe'><button data-a='login' style='width:100%'>Se connecter</button><button data-a='close' style='width:100%;margin-top:8px'>Annuler</button>`;$('lp').onkeydown=e=>{if(e.key==='Enter')AD.login()}}
let acct=null,SK='piece-dor-v1';
const legacy=(()=>{try{return JSON.parse(localStorage.getItem('piece-dor-v1'))}catch(e){return null}})();
const ACC=()=>{try{return JSON.parse(localStorage.getItem('pd-acc')||'{}')}catch(e){return{}}};
function afterLoad(){const away=Math.min((Date.now()-S.t)/1000,7200);if(away>60&&cps()>0){const g=cps()*away*(.25+.1*(S.pu.o||0));add(g);setTimeout(()=>toast('Pendant ton absence : +'+f(g)+' pièces'),1800)}
 const today=new Date().toDateString();if(S.day!==today){S.stk=(new Date(Date.now()-864e5).toDateString()===S.day)?(S.stk||0)+1:1;S.day=today;const d=Math.max(cps()*600,1000)*Math.min(S.stk,7);add(d);setTimeout(()=>toast('Bonus du jour (série de '+S.stk+') : +'+f(d)+' pièces 🎁'),3200)}
 if(!S.q||S.q.length<3)S.q=[newQ(),newQ(),newQ()];coin.textContent=S.cur;$('admb').hidden=!S.adm;render();stats()}
function enter(n,key,rem,mig,guest){acct=n;SK=guest?'piece-dor-v1':'piece-dor-v1:'+key;let d=null;try{d=JSON.parse(localStorage.getItem(SK))}catch(e){}
 if(!d&&mig&&legacy)d=legacy;S=Object.assign(def(),d||{});
 try{if(!guest){localStorage.setItem('pd-last',n);if(rem)localStorage.setItem('pd-auto',key);else localStorage.removeItem('pd-auto')}}catch(e){}
 $('auth').innerHTML='';$('auth').hidden=true;$('who').textContent='Pièce d’or · '+n;$('lo').hidden=false;afterLoad();toast('Bienvenue '+n+' !')}
function showAuth(mode){const a=$('auth');let last='';try{last=localStorage.getItem('pd-last')||''}catch(e){}a.hidden=false;
 a.innerHTML=`<div class='card'><div style='font-size:3rem'>🪙</div><h2>Pièce d’or</h2><div class='tabs'><button data-m='in' class='${mode==='in'?'on':''}'>Connexion</button><button data-m='up' class='${mode==='up'?'on':''}'>Créer un compte</button></div><input id='au' placeholder='Pseudo' maxlength='16' autocomplete='username' aria-label='Pseudo' value='${mode==='in'?last:''}'><input id='ap' type='password' placeholder='Mot de passe' aria-label='Mot de passe' autocomplete='${mode==='in'?'current-password':'new-password'}'>${mode==='up'?`<input id='ap2' type='password' placeholder='Confirme le mot de passe' aria-label='Confirmation' autocomplete='new-password'>`:''}<label class='rem'><input type='checkbox' id='ar'> Rester connecté sur cet appareil</label><div id='am' role='alert'></div><button id='ago' class='go'>${mode==='in'?'Se connecter':'Créer mon compte'}</button><button id='agu' class='guest'>Jouer en invité</button><small>Les comptes sont enregistrés sur cet appareil, dans ton navigateur.</small></div>`;
 a.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showAuth(b.dataset.m));
 a.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')$('ago').click()});
 $('agu').onclick=()=>enter('invité','',false,false,true);
 $('ago').onclick=()=>{const n=$('au').value.trim(),p=$('ap').value,acc=ACC(),key=n.toLowerCase(),msg=t=>{$('am').textContent=t};
  if(n.length<2){msg('Pseudo trop court (2 caractères minimum).');return}
  if(mode==='in'){if(!acc[key]||acc[key].h!==hs(p)){msg('Pseudo ou mot de passe incorrect.');return}enter(acc[key].n,key,$('ar').checked)}
  else{if(acc[key]){msg('Ce pseudo existe déjà.');return}if(p.length<4){msg('Mot de passe : 4 caractères minimum.');return}if(p!==$('ap2').value){msg('Les mots de passe ne correspondent pas.');return}
   const first=!Object.keys(acc).length;acc[key]={h:hs(p),n};try{localStorage.setItem('pd-acc',JSON.stringify(acc))}catch(e){msg('Enregistrement impossible sur cet appareil.');return}enter(n,key,$('ar').checked,first)}};
 setTimeout(()=>{const i=$('au');if(i)i.focus()},50)}
function bootAuth(){let k=null;try{k=localStorage.getItem('pd-auto')}catch(e){}const acc=ACC();if(k&&acc[k])enter(acc[k].n,k,true);else showAuth('in')}
$('lo').onclick=()=>{save();acct=null;S=def();admIn=false;try{localStorage.removeItem('pd-auto')}catch(e){}$('lo').hidden=true;$('who').textContent='Pièce d’or';coin.textContent='🪙';render();stats();showAuth('in')};
const stage=$('stage');
function spawn(txt,x,y,cls,css){const e=document.createElement('div');e.className=cls;e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';if(css)for(const k in css)e.style.setProperty(k,css[k]);stage.appendChild(e);setTimeout(()=>e.remove(),2600)}
function click(ev){
 const nw=Date.now();cmb=nw-lastC<350?Math.min(cmb+.04,3):1;lastC=nw;let v=cv();const cr=Math.random()<(S.cc!=null?S.cc:.02+.01*(S.pu.l||0));if(cr)v*=10;add(v);S.ck++;
 const r=stage.getBoundingClientRect();let x=r.width/2,y=r.height/2-20;
 if(ev&&ev.clientX){x=ev.clientX-r.left;y=ev.clientY-r.top}
 spawn((cr?'💥 CRIT +':'+')+f(v),x-14+Math.random()*28,y-20,'fx');
 const burst=(arr,n)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,d=60+Math.random()*80;spawn(arr[Math.floor(Math.random()*arr.length)],x,y,'bit',{'--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d-30+'px','--r':(Math.random()*720-360)+'deg'})}};
 if(S.fx.f1)burst(['🎊','🎉','🟡','🟢','🔵','🟣'],6);
 if(S.fx.f3)burst(['✨','⭐','🌟'],5);
 if(S.fx.f6)burst(['🔥','🧨','☄️'],5);
 if(S.fx.f9)burst(['💸','💵','💶','💴'],5);
 if(S.fx.f10)burst(['🎆','🎇','✨','🎊'],9);
 if(S.fx.f14)burst(['🫧','💧'],5);
 if(S.fx.f15)coin.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:220});
 if(S.fx.f16)stage.animate([{boxShadow:'inset 0 0 70px gold'},{boxShadow:'inset 0 0 0 transparent'}],{duration:400});
 if(S.fx.f18)burst(['🦋','🌸'],5);
 if(S.fx.f20)burst(['💫','⭐','🌀'],10);
 if(S.fx.f12)burst(['🐱','😺','🐾'],6);
 if(S.fx.f13)burst(['⚡','🌩️'],6);
 if(S.fx.f8)coin.animate([{filter:'hue-rotate(0deg)'},{filter:'hue-rotate(360deg)'}],{duration:450});
 if(S.fx.f4){stage.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(4px,-2px)'},{transform:'translate(0,0)'}],{duration:140})}
 ding(700+Math.random()*500);
}
const coin=$('coin');
coin.addEventListener('pointerdown',e=>{coin.classList.add('p');click(e)});
['pointerup','pointerleave','pointercancel'].forEach(t=>coin.addEventListener(t,()=>coin.classList.remove('p')));
coin.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)click()}});
coin.addEventListener('click',e=>{if(e.detail===0&&e.pointerType===undefined){}});
function items(){
 if(tab==='gen')return GENS.map(g=>{const o=S.g[g.id]||0,n=qn(g.b,1.15,o);return{k:'g:'+g.id,e:g.e,n:g.n+(n>1?' ×'+n:''),d:g.d+' · +'+f(g.c*mult('cps')*n)+'/s',c:bulk(g.b,1.15,o,n),o}});
 if(tab==='up'){const fn=qn(10,1.4,S.fing);const a=[{k:'fing',e:'👆',n:'Meilleur doigt'+(fn>1?' ×'+fn:''),d:'+'+fn+' par clic',c:bulk(10,1.4,S.fing,fn),o:S.fing}];
  UPS.forEach(u=>a.push({k:'u:'+u.id,e:u.e,n:u.n,d:u.d,c:u.p*PD,done:!!S.u[u.id]}));return a}
 if(tab==='fx')return FX.map(x=>({k:'x:'+x.id,e:x.e,n:x.n,d:x.d,c:x.p,done:!!S.fx[x.id]}));
 return SKINS.map(s=>({k:'s:'+s.id,e:s.id,n:s.n,d:S.cur===s.id?'Équipé':S.sk[s.id]?'Débloqué – toucher pour équiper':'Change l’apparence de la pièce',c:s.p,done:!!S.sk[s.id],eq:S.cur===s.id}))
}
function render(){
 $('qty').hidden=!(tab==='gen'||tab==='up'||tab==='rb');if(tab==='cas')return rCas();if(tab==='q')return rQ();if(tab==='pet')return rPet();if(tab==='rb')return rRb();if(tab==='ach')return rAch();if(tab==='code')return rCodes();
 $('list').innerHTML=items().map(i=>{const own=i.done&&!i.eq&&tab==='skin';
  return `<button class="item${i.done?' done':''}${!i.done&&S.m<i.c?' cant':''}" data-k="${i.k}" data-c="${i.c}"><span class="e">${i.e}</span><span><b>${i.n}</b><small>${i.d}</small></span><span class="c">${i.eq?'✔ Équipé':i.done?(own?'Équiper':'✔ Acheté'):f(i.c)+' 🪙'}${i.o!==undefined?`<span class="n">Possédé : ${i.o}</span>`:''}</span></button>`}).join('')}
function buy(k){
 const [t,id]=k.split(':');
 if(t==='cas'){bet(+id);return}if(t==='q'){claimQ(+id);return}if(t==='pet'){buyPet(id);return}if(t==='rb'){rebirth();return}if(t==='p'){buyP(id);return}if(t==='fing'){const n=qn(10,1.4,S.fing),c=bulk(10,1.4,S.fing,n);if(S.m<c)return;S.m-=c;S.fing+=n}
 else if(t==='g'){const g=GENS.find(x=>x.id===id),o=S.g[id]||0,n=qn(g.b,1.15,o),c=bulk(g.b,1.15,o,n);if(S.m<c)return;S.m-=c;S.g[id]=o+n}
 else if(t==='u'){const u=UPS.find(x=>x.id===id);if(S.u[id]||S.m<u.p*PD)return;S.m-=u.p*PD;S.u[id]=1;toast(u.n+' acheté !')}
 else if(t==='x'){const x=FX.find(y=>y.id===id);if(S.fx[id]||S.m<x.p)return;S.m-=x.p;S.fx[id]=1;toast(x.n+' activé !')}
 else if(t==='s'){const s=SKINS.find(y=>y.id===id);if(!S.sk[id]){if(S.m<s.p)return;S.m-=s.p;S.sk[id]=1}S.cur=id;coin.textContent=id}
 ding(1000);render();stats()}
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)buy(b.dataset.k)});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
function stats(){$('pc').textContent=f(cv());$('ps').textContent=f(cps());$('ck').textContent=f(S.ck);$('tt').textContent=f(S.tot);$('gc').textContent=f(S.gc);const b=$('bst');if(bm()>1){b.hidden=false;b.textContent='🔥 Boost ×'+bm()+' · '+Math.ceil((S.bu-Date.now())/1000)+' s'}else b.hidden=true;checkAch()}
let last=performance.now(),acc=0,rainT=0;
function loop(now){
 const dt=Math.min(now-last,1000)/1000*(S.spd||1);last=now;
 if(S.inf)S.m=Math.max(S.m,1e21);add((cps()+cv()*(S.acl||0))*dt);S.ck+=(S.acl||0)*dt;S.pt=(S.pt||0)+dt/(S.spd||1);if(Date.now()-lastC>600)cmb=1;$('money').textContent=f(S.m);
 acc+=dt;if(acc>.25){acc=0;stats();document.querySelectorAll('.item:not(.pit)').forEach(b=>{if(!b.classList.contains('done'))b.classList.toggle('cant',S.m<+b.dataset.c)})}
 const rn=[S.fx.f2&&'🪙',S.fx.f7&&'❄️',S.fx.f11&&'🌸',S.fx.f17&&'🍂'].filter(Boolean);if(rn.length){rainT+=dt;if(rainT>.35/rn.length){rainT=0;spawn(rn[Math.floor(Math.random()*rn.length)],Math.random()*(stage.clientWidth-20),0,'rain')}}
 requestAnimationFrame(loop)}
let gEl=null;
function goldenSoon(){const lucky=S.u.u7?.5:1;setTimeout(()=>{golden();goldenSoon()},(60000+Math.random()*90000)*lucky*petM('lucky'))}
function golden(){if(gEl||document.hidden)return;const e=document.createElement('button');e.id='gold';const sk=Math.random()<.15;if(sk)e.dataset.sk=1;e.textContent=sk?'☠️':'🌟';e.setAttribute('aria-label','Pièce dorée, cliquer pour un gros bonus');
 e.style.left=(10+Math.random()*(stage.clientWidth-70))+'px';e.style.top=(60+Math.random()*(stage.clientHeight-120))+'px';
 e.onclick=()=>{const r=Math.random(),k=1+.25*(S.pu.g||0),n=Date.now();S.gc++;
 if(e.dataset.sk){const b=cps()*300+cv()*500;add(b);S.cu=n+20000;toast('Pièce maudite : +'+f(b)+' mais production ÷3 pendant 20 s');ding(200)}
 else{if(r<.5){const b=Math.max(cps()*30,cv()*50)*k;add(b);toast('Pièce dorée ! +'+f(b))}
 else if(r<.75){S.bm=Math.max(bm(),7);S.bu=n+30000*k;toast('Frénésie ! Production ×7 pendant '+Math.round(30*k)+' s')}
 else if(r<.95){S.cf=n+15000*k;toast('Frénésie de clics ! Clic ×20')}
 else{S.rp+=1;toast('Éclat rare : +1 💠')}ding(1500)}
 e.remove();gEl=null;stats()};
 stage.appendChild(e);gEl=e;setTimeout(()=>{if(gEl===e){e.remove();gEl=null}},9000)}
function save(){if(!acct)return;S.t=Date.now();try{localStorage.setItem(SK,JSON.stringify(S));$('save').textContent='Sauvegardé ✔'}catch(e){$('save').textContent='Sauvegarde indisponible'}}
$('reset').onclick=()=>{if(confirm('Tout effacer et recommencer ?')){S=def();try{localStorage.removeItem(SK)}catch(e){}coin.textContent='🪙';render();stats()}};
setInterval(save,5000);addEventListener('beforeunload',save);
// gains hors ligne (50 % de la production, 2 h max)
const away=Math.min((Date.now()-S.t)/1000,7200);
if(false){const g=cps()*away*(.25+.1*(S.pu.o||0));add(g);setTimeout(()=>toast('Pendant ton absence : +'+f(g)+' pièces'),600)}
const today=new Date().toDateString();if(false){S.stk=(new Date(Date.now()-864e5).toDateString()===S.day)?(S.stk||0)+1:1;S.day=today;const d=Math.max(cps()*600,1000)*Math.min(S.stk,7);add(d);setTimeout(()=>toast('Bonus du jour (série de '+S.stk+') : +'+f(d)+' pièces 🎁'),1500)}
if(!S.q||S.q.length<3)S.q=[newQ(),newQ(),newQ()];
$('admb').hidden=!S.adm;$('admb').onclick=openAdmin;
coin.textContent=S.cur;render();stats();goldenSoon();requestAnimationFrame(loop);bootAuth();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pièce d’or – Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f0df;--panel:#fffaf0;--ink:#2a2418;--mut:#7a6f55;--line:#e4d9b8;--gold:#e9a60f;--ok:#2f9e6e;--cant:.45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10211f;--panel:#183532;--ink:#f4efe2;--mut:#9fb8b0;--line:#27504a;--gold:#f2b632;--ok:#7fe3c0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10211f;--panel:#183532;--ink:#f4efe2;--mut:#9fb8b0;--line:#27504a;--gold:#f2b632;--ok:#7fe3c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1.1fr}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:20px;text-align:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--mut)}
#money{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;line-height:1.1;margin:6px 0 2px;color:var(--gold)}
.rates{color:var(--mut);font-size:.95rem}
#coin{all:unset;cursor:pointer;display:block;margin:18px auto 8px;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;font-size:min(34vw,130px);line-height:1;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b632 55%,#b9780a);box-shadow:0 10px 0 #8a5a06,0 18px 30px rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s;-webkit-tap-highlight-color:transparent}
#coin:active,#coin.p{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 #8a5a06,0 6px 14px rgba(0,0,0,.25)}
#coin:focus-visible{outline:4px solid var(--ok);outline-offset:6px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin-top:12px}
.fx{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.35);animation:up .9s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.bit{position:absolute;pointer-events:none;animation:fly .9s ease-out forwards;z-index:4}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.rain{position:absolute;top:-30px;pointer-events:none;animation:fall 2.4s linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(560px) rotate(360deg)}}
#gold{position:absolute;z-index:6;border:0;background:none;font-size:2.6rem;cursor:pointer;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.25) rotate(12deg)}}
.shop{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:14px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a2418;border-color:var(--gold)}
#list{display:grid;gap:8px;overflow-y:auto;max-height:62vh;padding-right:2px}
.item{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;width:100%}
.item:hover:not(.cant){border-color:var(--ok)}
.item.cant{opacity:var(--cant);cursor:not-allowed}
.item.done{border-color:var(--ok)}
.item .e{font-size:1.9rem;width:2.2rem;text-align:center}
.item b{display:block;font-weight:600}
.item small{color:var(--mut);display:block;font-size:.8rem}
.item .c{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.item .n{color:var(--mut);font-size:.8rem;font-weight:400;display:block}
.foot{margin-top:10px;display:flex;gap:8px;justify-content:space-between;color:var(--mut);font-size:.8rem}
.foot button{font:inherit;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.s{opacity:1}
@media(prefers-reduced-motion:reduce){.fx,.bit,.rain,#gold{animation-duration:.01s}}
</style>
</head>
<body>
<div class="wrap">
 <section class="stage" id="stage">
  <h1>Pièce d’or</h1>
  <div id="money">0</div>
  <div class="rates"><span id="pc">1</span> par clic · <span id="ps">0</span> par seconde</div>
  <button id="coin" aria-label="Cliquer pour gagner des pièces">🪙</button>
  <div class="stats"><span>Clics : <b id="ck">0</b></span><span>Total gagné : <b id="tt">0</b></span><span>Pièces dorées : <b id="gc">0</b></span></div>
 </section>
 <section class="shop">
  <div class="tabs" role="tablist">
   <button class="on" data-t="gen">Auto</button><button data-t="up">Boosts</button><button data-t="fx">Effets</button><button data-t="skin">Skins</button>
  </div>
  <div id="list"></div>
  <div class="foot"><span id="save">Sauvegarde auto</span><button id="reset">Tout recommencer</button></div>
 </section>
</div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const GENS=[
 {id:'a',e:'🖱️',n:'Autoclicker',d:'Clique pour toi',b:15,c:1},
 {id:'b',e:'⛏️',n:'Mineur',d:'Creuse des pièces',b:100,c:5},
 {id:'c',e:'🐓',n:'Poule aux œufs d’or',d:'Pond sans arrêt',b:600,c:20},
 {id:'d',e:'🏭',n:'Usine à pièces',d:'Production en série',b:3500,c:100},
 {id:'e',e:'🏦',n:'Banque',d:'Les intérêts, ça rapporte',b:20000,c:550},
 {id:'f',e:'🚀',n:'Mine spatiale',d:'Astéroïdes en or',b:130000,c:3000},
 {id:'g',e:'🌀',n:'Portail dimensionnel',d:'Pièces d’autres mondes',b:900000,c:20000},
 {id:'h',e:'⏳',n:'Machine à remonter le temps',d:'Gagne hier aussi',b:7e6,c:150000}
];
const UPS=[
 {id:'u1',e:'🧤',n:'Gants dorés',d:'Clic ×2',p:250,t:'click',m:2},
 {id:'u2',e:'👑',n:'Main de Midas',d:'Clic ×3',p:5000,t:'click',m:3},
 {id:'u3',e:'🔦',n:'Doigt laser',d:'Clic ×5',p:90000,t:'click',m:5},
 {id:'u4',e:'☕',n:'Café pour les robots',d:'Auto ×2',p:1500,t:'cps',m:2},
 {id:'u5',e:'⚡',n:'Courant haute tension',d:'Auto ×2',p:60000,t:'cps',m:2},
 {id:'u6',e:'🧠',n:'Cerveau quantique',d:'Tout ×2',p:1.5e6,t:'all',m:2},
 {id:'u7',e:'🍀',n:'Trèfle à quatre feuilles',d:'Pièces dorées plus fréquentes',p:8000,t:'lucky',m:1},
 {id:'u8',e:'🌌',n:'Singularité',d:'Tout ×3',p:5e7,t:'all',m:3}
];
const FX=[
 {id:'f1',e:'🎉',n:'Confettis',d:'Des confettis à chaque clic',p:150},
 {id:'f2',e:'🌧️',n:'Pluie de pièces',d:'Il pleut de l’argent en fond',p:700},
 {id:'f3',e:'✨',n:'Explosion d’étoiles',d:'Étoiles à chaque clic',p:2500},
 {id:'f4',e:'📳',n:'Secousse',d:'L’écran tremble un peu',p:1200},
 {id:'f5',e:'🔊',n:'Bruitages',d:'Un « ding » à chaque clic',p:400}
];
const SKINS=[
 {id:'🪙',n:'Pièce classique',p:0},{id:'🍪',n:'Cookie',p:400},{id:'💎',n:'Diamant',p:6000},
 {id:'🐱',n:'Chat doré',p:30000},{id:'🌟',n:'Étoile',p:150000},{id:'🍕',n:'Pizza',p:1e6},{id:'🌍',n:'Planète',p:2e7}
];
const def=()=>({m:0,tot:0,ck:0,gc:0,fing:0,g:{},u:{},fx:{},sk:{'🪙':1},cur:'🪙',t:Date.now()});
let S=def();
try{const r=localStorage.getItem('piece-dor-v1');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
let tab='gen';
const SUF=['','k','M','Md','B','Bd','T'];
function f(n){if(n<1000)return Math.floor(n).toLocaleString('fr-FR');let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return n.toFixed(n<10?2:1).replace('.',',')+' '+SUF[i]}
function mult(t){let x=1;for(const u of UPS)if(S.u[u.id]&&(u.t===t||u.t==='all'&&t!=='x'))x*=u.m;return x}
const allM=()=>UPS.reduce((x,u)=>S.u[u.id]&&u.t==='all'?x*u.m:x,1);
const cv=()=>(1+S.fing)*UPS.reduce((x,u)=>S.u[u.id]&&u.t==='click'?x*u.m:x,1)*allM();
const cps=()=>GENS.reduce((s,g)=>s+(S.g[g.id]||0)*g.c,0)*UPS.reduce((x,u)=>S.u[u.id]&&u.t==='cps'?x*u.m:x,1)*allM();
const gcost=g=>Math.ceil(g.b*Math.pow(1.15,S.g[g.id]||0));
const fcost=()=>Math.ceil(10*Math.pow(1.4,S.fing));
function add(n){S.m+=n;S.tot+=n}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),2200)}
let ac;function ding(f0=880){if(!S.fx.f5)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f0;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
const stage=$('stage');
function spawn(txt,x,y,cls,css){const e=document.createElement('div');e.className=cls;e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';if(css)for(const k in css)e.style.setProperty(k,css[k]);stage.appendChild(e);setTimeout(()=>e.remove(),2600)}
function click(ev){
 const v=cv();add(v);S.ck++;
 const r=stage.getBoundingClientRect();let x=r.width/2,y=r.height/2-20;
 if(ev&&ev.clientX){x=ev.clientX-r.left;y=ev.clientY-r.top}
 spawn('+'+f(v),x-14+Math.random()*28,y-20,'fx');
 const burst=(arr,n)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,d=60+Math.random()*80;spawn(arr[Math.floor(Math.random()*arr.length)],x,y,'bit',{'--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d-30+'px','--r':(Math.random()*720-360)+'deg'})}};
 if(S.fx.f1)burst(['🎊','🎉','🟡','🟢','🔵','🟣'],6);
 if(S.fx.f3)burst(['✨','⭐','🌟'],5);
 if(S.fx.f4){stage.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(4px,-2px)'},{transform:'translate(0,0)'}],{duration:140})}
 ding(700+Math.random()*500);
}
const coin=$('coin');
coin.addEventListener('pointerdown',e=>{coin.classList.add('p');click(e)});
['pointerup','pointerleave','pointercancel'].forEach(t=>coin.addEventListener(t,()=>coin.classList.remove('p')));
coin.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)click()}});
coin.addEventListener('click',e=>{if(e.detail===0&&e.pointerType===undefined){}});
function items(){
 if(tab==='gen')return GENS.map(g=>({k:'g:'+g.id,e:g.e,n:g.n,d:g.d+' · +'+f(g.c*mult('cps'))+'/s',c:gcost(g),o:S.g[g.id]||0}));
 if(tab==='up'){const a=[{k:'fing',e:'👆',n:'Meilleur doigt',d:'+1 par clic',c:fcost(),o:S.fing}];
  UPS.forEach(u=>a.push({k:'u:'+u.id,e:u.e,n:u.n,d:u.d,c:u.p,done:!!S.u[u.id]}));return a}
 if(tab==='fx')return FX.map(x=>({k:'x:'+x.id,e:x.e,n:x.n,d:x.d,c:x.p,done:!!S.fx[x.id]}));
 return SKINS.map(s=>({k:'s:'+s.id,e:s.id,n:s.n,d:S.cur===s.id?'Équipé':S.sk[s.id]?'Débloqué – toucher pour équiper':'Change l’apparence de la pièce',c:s.p,done:!!S.sk[s.id],eq:S.cur===s.id}))
}
function render(){
 $('list').innerHTML=items().map(i=>{const own=i.done&&!i.eq&&tab==='skin';
  return `<button class="item${i.done?' done':''}${!i.done&&S.m<i.c?' cant':''}" data-k="${i.k}" data-c="${i.c}"><span class="e">${i.e}</span><span><b>${i.n}</b><small>${i.d}</small></span><span class="c">${i.eq?'✔ Équipé':i.done?(own?'Équiper':'✔ Acheté'):f(i.c)+' 🪙'}${i.o!==undefined?`<span class="n">Possédé : ${i.o}</span>`:''}</span></button>`}).join('')}
function buy(k){
 const [t,id]=k.split(':');
 if(t==='fing'){const c=fcost();if(S.m<c)return;S.m-=c;S.fing++}
 else if(t==='g'){const g=GENS.find(x=>x.id===id),c=gcost(g);if(S.m<c)return;S.m-=c;S.g[id]=(S.g[id]||0)+1}
 else if(t==='u'){const u=UPS.find(x=>x.id===id);if(S.u[id]||S.m<u.p)return;S.m-=u.p;S.u[id]=1;toast(u.n+' acheté !')}
 else if(t==='x'){const x=FX.find(y=>y.id===id);if(S.fx[id]||S.m<x.p)return;S.m-=x.p;S.fx[id]=1;toast(x.n+' activé !')}
 else if(t==='s'){const s=SKINS.find(y=>y.id===id);if(!S.sk[id]){if(S.m<s.p)return;S.m-=s.p;S.sk[id]=1}S.cur=id;coin.textContent=id}
 ding(1000);render();stats()}
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)buy(b.dataset.k)});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
function stats(){$('pc').textContent=f(cv());$('ps').textContent=f(cps());$('ck').textContent=f(S.ck);$('tt').textContent=f(S.tot);$('gc').textContent=f(S.gc)}
let last=performance.now(),acc=0,rainT=0;
function loop(now){
 const dt=Math.min(now-last,1000)/1000;last=now;
 add(cps()*dt);$('money').textContent=f(S.m);
 acc+=dt;if(acc>.25){acc=0;stats();document.querySelectorAll('.item').forEach(b=>{if(!b.classList.contains('done'))b.classList.toggle('cant',S.m<+b.dataset.c)})}
 if(S.fx.f2){rainT+=dt;if(rainT>.35){rainT=0;spawn('🪙',Math.random()*(stage.clientWidth-20),0,'rain')}}
 requestAnimationFrame(loop)}
let gEl=null;
function goldenSoon(){const lucky=S.u.u7?.5:1;setTimeout(()=>{golden();goldenSoon()},(25000+Math.random()*35000)*lucky)}
function golden(){if(gEl||document.hidden)return;const e=document.createElement('button');e.id='gold';e.textContent='🌟';e.setAttribute('aria-label','Pièce dorée, cliquer pour un gros bonus');
 e.style.left=(10+Math.random()*(stage.clientWidth-70))+'px';e.style.top=(60+Math.random()*(stage.clientHeight-120))+'px';
 e.onclick=()=>{const b=Math.max(cps()*60,cv()*100);add(b);S.gc++;toast('Pièce dorée ! +'+f(b));ding(1500);e.remove();gEl=null;stats()};
 stage.appendChild(e);gEl=e;setTimeout(()=>{if(gEl===e){e.remove();gEl=null}},9000)}
function save(){S.t=Date.now();try{localStorage.setItem('piece-dor-v1',JSON.stringify(S));$('save').textContent='Sauvegardé ✔'}catch(e){$('save').textContent='Sauvegarde indisponible'}}
$('reset').onclick=()=>{if(confirm('Tout effacer et recommencer ?')){S=def();try{localStorage.removeItem('piece-dor-v1')}catch(e){}coin.textContent='🪙';render();stats()}};
setInterval(save,5000);addEventListener('beforeunload',save);
// gains hors ligne (50 % de la production, 2 h max)
const away=Math.min((Date.now()-S.t)/1000,7200);
if(away>60&&cps()>0){const g=cps()*away*.5;add(g);setTimeout(()=>toast('Pendant ton absence : +'+f(g)+' pièces'),600)}
coin.textContent=S.cur;render();stats();goldenSoon();requestAnimationFrame(loop);
</script>
</body>
</html>

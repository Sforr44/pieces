<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pièce d’or – Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f0df;--panel:#fffaf0;--ink:#2a2418;--mut:#7a6f55;--line:#e4d9b8;--gold:#e9a60f;--ok:#2f9e6e;--cant:.45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10211f;--panel:#183532;--ink:#f4efe2;--mut:#9fb8b0;--line:#27504a;--gold:#f2b632;--ok:#7fe3c0}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10211f;--panel:#183532;--ink:#f4efe2;--mut:#9fb8b0;--line:#27504a;--gold:#f2b632;--ok:#7fe3c0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr 1.1fr}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.stage{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:20px;text-align:center;overflow:hidden;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--mut)}
#money{font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;line-height:1.1;margin:6px 0 2px;color:var(--gold)}
.rates{color:var(--mut);font-size:.95rem}
#coin{all:unset;cursor:pointer;display:block;margin:18px auto 8px;width:min(62vw,230px);aspect-ratio:1;border-radius:50%;font-size:min(34vw,130px);line-height:1;display:grid;place-items:center;
background:radial-gradient(circle at 35% 30%,#fff3c4,#f2b632 55%,#b9780a);box-shadow:0 10px 0 #8a5a06,0 18px 30px rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s;-webkit-tap-highlight-color:transparent}
#coin:active,#coin.p{transform:translateY(8px) scale(.97);box-shadow:0 2px 0 #8a5a06,0 6px 14px rgba(0,0,0,.25)}
#coin:focus-visible{outline:4px solid var(--ok);outline-offset:6px}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin-top:12px}
.fx{position:absolute;pointer-events:none;font-weight:700;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.35);animation:up .9s ease-out forwards;z-index:5}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.bit{position:absolute;pointer-events:none;animation:fly .9s ease-out forwards;z-index:4}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.rain{position:absolute;top:-30px;pointer-events:none;animation:fall 2.4s linear forwards;opacity:.8}
@keyframes fall{to{transform:translateY(560px) rotate(360deg)}}
#gold{position:absolute;z-index:6;border:0;background:none;font-size:2.6rem;cursor:pointer;animation:pulse .8s infinite alternate}
@keyframes pulse{to{transform:scale(1.25) rotate(12deg)}}
.shop{background:var(--panel);border:2px solid var(--line);border-radius:28px;padding:14px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border-radius:14px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a2418;border-color:var(--gold)}
#list{display:grid;gap:8px;overflow-y:auto;max-height:62vh;padding-right:2px}
.item{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 12px;cursor:pointer;width:100%}
.item:hover:not(.cant){border-color:var(--ok)}
.item.cant{opacity:var(--cant);cursor:not-allowed}
.item.done{border-color:var(--ok)}
.item .e{font-size:1.9rem;width:2.2rem;text-align:center}
.item b{display:block;font-weight:600}
.item small{color:var(--mut);display:block;font-size:.8rem}
.item .c{margin-left:auto;font-weight:700;color:var(--gold);white-space:nowrap;text-align:right}
.item .n{color:var(--mut);font-size:.8rem;font-weight:400;display:block}
.foot{margin-top:10px;display:flex;gap:8px;justify-content:space-between;color:var(--mut);font-size:.8rem}
.foot button{font:inherit;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
#toast.s{opacity:1}
.tabs{flex-wrap:wrap}.tabs button{min-width:22%;font-size:.85rem;padding:8px 4px}
.ach{display:flex;gap:12px;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px 12px;opacity:.5}.ach.ok{opacity:1;border-color:var(--ok)}.ach .e{font-size:1.7rem}
.box{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:12px;color:var(--mut);font-size:.9rem}
.code{display:flex;gap:8px}.code input{flex:1;font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-transform:uppercase;min-width:0}.code button{font:inherit;font-weight:600;padding:10px 16px;border-radius:14px;border:0;background:var(--gold);color:#2a2418;cursor:pointer}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
#bst{color:var(--ok);font-weight:600}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:grid;place-items:center;padding:16px}#adm[hidden]{display:none}
.ap{background:var(--panel);border:2px solid var(--gold);border-radius:24px;padding:16px;width:min(520px,100%);max-height:88vh;overflow-y:auto}.ap h2{margin:0 0 8px;font-size:1.2rem}
.ap input{width:100%;font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.ap .g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.ap button{font:inherit;padding:9px 8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}.ap button:hover{border-color:var(--gold)}
.qty{display:flex;gap:6px;margin-bottom:8px}.qty[hidden]{display:none}.qty button{flex:1;font:inherit;padding:6px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--ink);cursor:pointer}.qty button.on{border-color:var(--ok);color:var(--ok);font-weight:600}
@media(prefers-reduced-motion:reduce){.fx,.bit,.rain,#gold{animation-duration:.01s}}
</style>
</head>
<body>
<div class="wrap">
 <section class="stage" id="stage">
  <h1>Pièce d’or</h1>
  <div id="money">0</div>
  <div class="rates"><span id="pc">1</span> par clic · <span id="ps">0</span> par seconde</div>
  <div id="bst" class="rates" hidden></div>
  <button id="coin" aria-label="Cliquer pour gagner des pièces">🪙</button>
  <div class="stats"><span>Clics : <b id="ck">0</b></span><span>Total gagné : <b id="tt">0</b></span><span>Pièces dorées : <b id="gc">0</b></span></div>
 </section>
 <section class="shop">
  <div class="tabs" role="tablist">
   <button class="on" data-t="gen">Auto</button><button data-t="up">Boosts</button><button data-t="fx">Effets</button><button data-t="skin">Skins</button><button data-t="rb">Rebirth</button><button data-t="ach">Succès</button><button data-t="code">Codes</button>
  </div>
  <div class="qty" id="qty"><button data-q="1" class="on">×1</button><button data-q="10">×10</button><button data-q="100">×100</button><button data-q="max">Max</button></div>
  <div id="list"></div>
  <div class="foot"><span id="save">Sauvegarde auto</span><button id="admb" hidden>🛠️ Admin</button><button id="reset">Tout recommencer</button></div>
 </section>
</div>
<div id="adm" hidden><div class="ap" role="dialog" aria-label="Panneau admin"></div></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const GENS=[
 {id:'a',e:'🖱️',n:'Autoclicker',d:'Clique pour toi',b:15,c:1},
 {id:'a2',e:'🧒',n:'Petit frère',d:'Clique quand il s’ennuie',b:45,c:2},
 {id:'b',e:'⛏️',n:'Mineur',d:'Creuse des pièces',b:100,c:5},
 {id:'c',e:'🐓',n:'Poule aux œufs d’or',d:'Pond sans arrêt',b:600,c:20},
 {id:'d',e:'🏭',n:'Usine à pièces',d:'Production en série',b:3500,c:100},
 {id:'e',e:'🏦',n:'Banque',d:'Les intérêts, ça rapporte',b:20000,c:550},
 {id:'f',e:'🚀',n:'Mine spatiale',d:'Astéroïdes en or',b:130000,c:3000},
 {id:'g',e:'🌀',n:'Portail dimensionnel',d:'Pièces d’autres mondes',b:900000,c:20000},
 {id:'h',e:'⏳',n:'Machine à remonter le temps',d:'Gagne hier aussi',b:7e6,c:150000},
 {id:'i',e:'🧙',n:'Alchimiste',d:'Transforme le plomb en or',b:5e7,c:1e6},
 {id:'j',e:'🐲',n:'Dragon gardien',d:'Veille sur un trésor sans fin',b:4e8,c:7e6},
 {id:'k',e:'🌌',n:'Galaxie entière',d:'Des milliards d’étoiles en or',b:3e9,c:5e7},
 {id:'l',e:'🎰',n:'Casino cosmique',d:'La banque gagne toujours',b:2.5e10,c:4e8},
 {id:'m',e:'♾️',n:'Machine à l’infini',d:'Aucune limite',b:2e11,c:3e9}
];
const UPS=[
 {id:'u1',e:'🧤',n:'Gants dorés',d:'Clic ×2',p:250,t:'click',m:2},
 {id:'u2',e:'👑',n:'Main de Midas',d:'Clic ×3',p:5000,t:'click',m:3},
 {id:'u3',e:'🔦',n:'Doigt laser',d:'Clic ×5',p:90000,t:'click',m:5},
 {id:'u4',e:'☕',n:'Café pour les robots',d:'Auto ×2',p:1500,t:'cps',m:2},
 {id:'u5',e:'⚡',n:'Courant haute tension',d:'Auto ×2',p:60000,t:'cps',m:2},
 {id:'u6',e:'🧠',n:'Cerveau quantique',d:'Tout ×2',p:1.5e6,t:'all',m:2},
 {id:'u7',e:'🍀',n:'Trèfle à quatre feuilles',d:'Pièces dorées plus fréquentes',p:8000,t:'lucky',m:1},
 {id:'u8',e:'🌌',n:'Singularité',d:'Tout ×3',p:5e7,t:'all',m:3},
 {id:'u9',e:'🥊',n:'Poing d’acier',d:'Clic ×4',p:3e5,t:'click',m:4},
 {id:'u11',e:'🛠️',n:'Maintenance préventive',d:'Auto ×3',p:5e5,t:'cps',m:3},
 {id:'u10',e:'🔮',n:'Boule de cristal',d:'Clic ×10',p:2e8,t:'click',m:10},
 {id:'u12',e:'🤝',n:'Syndicat des robots',d:'Auto ×5',p:5e8,t:'cps',m:5},
 {id:'u13',e:'📈',n:'Bourse infinie',d:'Tout ×5',p:5e9,t:'all',m:5},
 {id:'u14',e:'🧬',n:'Évolution',d:'Tout ×10',p:1e11,t:'all',m:10}
];
const FX=[
 {id:'f1',e:'🎉',n:'Confettis',d:'Des confettis à chaque clic',p:150},
 {id:'f2',e:'🌧️',n:'Pluie de pièces',d:'Il pleut de l’argent en fond',p:700},
 {id:'f3',e:'✨',n:'Explosion d’étoiles',d:'Étoiles à chaque clic',p:2500},
 {id:'f4',e:'📳',n:'Secousse',d:'L’écran tremble un peu',p:1200},
 {id:'f5',e:'🔊',n:'Bruitages',d:'Un « ding » à chaque clic',p:400},
 {id:'f6',e:'🔥',n:'Traînée de feu',d:'Des flammes jaillissent à chaque clic',p:5000},
 {id:'f7',e:'❄️',n:'Neige',d:'Il neige doucement en fond',p:9000},
 {id:'f8',e:'🌈',n:'Arc-en-ciel',d:'La pièce change de couleur à chaque clic',p:15000},
 {id:'f11',e:'🌸',n:'Pétales',d:'Des pétales tombent en fond',p:25000},
 {id:'f9',e:'💸',n:'Billets volants',d:'Des billets s’envolent à chaque clic',p:40000},
 {id:'f10',e:'🎆',n:'Feux d’artifice',d:'Un vrai feu d’artifice à chaque clic',p:120000}
];
const SKINS=[
 {id:'🪙',n:'Pièce classique',p:0},{id:'🍪',n:'Cookie',p:400},{id:'🍩',n:'Donut',p:1500},{id:'💎',n:'Diamant',p:6000},{id:'🍔',n:'Burger',p:15000},{id:'🤖',n:'Robot',p:60000},
 {id:'🐱',n:'Chat doré',p:30000},{id:'🌟',n:'Étoile',p:150000},{id:'🍕',n:'Pizza',p:1e6},{id:'🌍',n:'Planète',p:2e7},{id:'🦄',n:'Licorne',p:6e7},{id:'👾',n:'Alien',p:2e8},{id:'🐉',n:'Dragon',p:8e8},{id:'👑',n:'Couronne royale',p:5e9}
];
const def=()=>({m:0,tot:0,run:0,ck:0,gc:0,fing:0,g:{},u:{},fx:{},sk:{'🪙':1},cur:'🪙',t:Date.now(),rb:0,rp:0,pu:{},codes:{},ach:{},bm:1,bu:0,day:''});
let S=def();
try{const r=localStorage.getItem('piece-dor-v1');if(r)S=Object.assign(def(),JSON.parse(r))}catch(e){}
let tab='gen';
const SUF=['','k','M','Md','B','Bd','T'];
function f(n){if(n<1000)return Math.floor(n).toLocaleString('fr-FR');let i=0;while(n>=1000&&i<SUF.length-1){n/=1000;i++}return n.toFixed(n<10?2:1).replace('.',',')+' '+SUF[i]}
function mult(t){let x=1;for(const u of UPS)if(S.u[u.id]&&(u.t===t||u.t==='all'&&t!=='x'))x*=u.m;return x}
const allM=()=>UPS.reduce((x,u)=>S.u[u.id]&&u.t==='all'?x*u.m:x,1);
const cv=()=>(1+S.fing)*UPS.reduce((x,u)=>S.u[u.id]&&u.t==='click'?x*u.m:x,1)*allM()*gm()*(1+.5*(S.pu.c||0));
const cps=()=>GENS.reduce((s,g)=>s+(S.g[g.id]||0)*g.c,0)*UPS.reduce((x,u)=>S.u[u.id]&&u.t==='cps'?x*u.m:x,1)*allM()*gm()*(1+.5*(S.pu.a||0));
const gcost=g=>Math.ceil(g.b*Math.pow(1.15,S.g[g.id]||0));
const fcost=()=>Math.ceil(10*Math.pow(1.4,S.fing));
function add(n){S.m+=n;S.tot+=n;S.run+=n}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('s'),2200)}
let ac;function ding(f0=880){if(!S.fx.f5)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f0;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.18);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.2)}catch(e){}}
const CODES={BIENVENUE:['c',500],SIMON:['c',2500],CLICKER:['c',10000],PIECEDOR:['s',600],MIDAS:['b',3,60],TURBO:['b',2,120],MINEUR:['s',900],BOOST:['b',5,30],SUPERBOOST:['b',4,90],JACKPOT:['c',1e6],LUCKY777:['c',777777],BANQUE:['s',1800],ESPACE:['c',5e6],PORTAIL:['s',3600],TEMPS:['b',10,20],REBIRTH:['p',3],SECRET:['p',2],KONAMI:['c',3e5],NOEL:['b',3,180],MERCI:['s',1200]};
const P=[{id:'c',e:'💪',n:'Doigts de fer',d:'+50 % de gain par clic',cost:l=>2*(l+1),max:50},{id:'a',e:'🤖',n:'Robots améliorés',d:'+50 % de production auto',cost:l=>2*(l+1),max:50},{id:'l',e:'💥',n:'Coups critiques',d:'+1 % de chance de clic ×10',cost:l=>3*(l+1),max:20},{id:'s',e:'🎁',n:'Capital de départ',d:'+10 000 pièces au début de chaque rebirth',cost:l=>3*(l+1),max:10}];
const nG=()=>GENS.reduce((s,g)=>s+(S.g[g.id]||0),0);
const ACH=[['Premier clic','👆',()=>S.ck>=1],['100 clics','🖱️',()=>S.ck>=100],['1 000 clics','🔥',()=>S.ck>=1000],['10 000 clics','🏋️',()=>S.ck>=1e4],['Gagner 1 000 pièces','💰',()=>S.tot>=1e3],['Gagner 1 million','🤑',()=>S.tot>=1e6],['Gagner 1 milliard','🏆',()=>S.tot>=1e9],['10 bâtiments','🏗️',()=>nG()>=10],['50 bâtiments','🏙️',()=>nG()>=50],['Premier rebirth','♻️',()=>S.rb>=1],['3 rebirths','🌀',()=>S.rb>=3],['5 pièces dorées','🌟',()=>S.gc>=5],['5 codes utilisés','🔑',()=>Object.keys(S.codes).length>=5]];
const achN=()=>Object.keys(S.ach).length;
const bm=()=>S.bu>Date.now()?S.bm:1;
const gm=()=>(1+.2*S.rb)*(1+.02*achN())*bm()*(S.am||1);
const rbReq=()=>1e6*Math.pow(4,S.rb);
const rbGain=()=>S.run>=rbReq()?Math.max(2,Math.floor(2*Math.sqrt(S.run/rbReq()))):0;
function checkAch(){ACH.forEach((a,i)=>{if(!S.ach[i]&&a[2]()){S.ach[i]=1;toast('Succès : '+a[0]+' '+a[1]+' (+2 % de gains)');if(tab==='ach')rAch()}})}
function rebirth(){const g=rbGain();if(!g)return;if(!confirm('Rebirth : tu perds pièces, bâtiments et boosts, mais tu gagnes '+g+' points 💠 et +20 % de gains permanents. Continuer ?'))return;
 S.rp+=g;S.rb++;S.m=(S.pu.s||0)*1e4;S.run=0;S.fing=0;S.g={};S.u={};toast('Rebirth n°'+S.rb+' ! +'+g+' 💠');ding(500);render();stats()}
function buyP(id){const p=P.find(x=>x.id===id),l=S.pu[id]||0;if(l>=p.max||S.rp<p.cost(l))return;S.rp-=p.cost(l);S.pu[id]=l+1;ding(1000);render();stats()}
function rRb(){const q=rbReq(),g=rbGain(),pc=Math.min(100,S.run/q*100);
 $('list').innerHTML=`<div class="box">Rebirths : <b>${S.rb}</b> · Bonus permanent : <b>×${(1+.2*S.rb).toFixed(1).replace('.',',')}</b> · Points : <b>${S.rp} 💠</b><div class="bar"><i style="width:${pc}%"></i></div><small>${f(S.run)} / ${f(q)} gagnées dans cette partie</small></div>`+
 `<button class="item pit${g?'':' cant'}" data-k="rb:"><span class="e">♻️</span><span><b>Faire un rebirth</b><small>${g?'Gagne '+g+' 💠 et +20 % de gains':'Pas encore assez de pièces'}</small></span></button>`+
 P.map(p=>{const l=S.pu[p.id]||0,c=p.cost(l);return `<button class="item pit${S.rp<c||l>=p.max?' cant':''}" data-k="p:${p.id}"><span class="e">${p.e}</span><span><b>${p.n}</b><small>${p.d}</small></span><span class="c">${l>=p.max?'Max':c+' 💠'}<span class="n">Niveau ${l}</span></span></button>`}).join('')}
function rAch(){$('list').innerHTML=`<div class="box">Chaque succès donne +2 % de gains. Débloqués : <b>${achN()}/${ACH.length}</b></div>`+ACH.map((a,i)=>`<div class="ach${S.ach[i]?' ok':''}"><span class="e">${S.ach[i]?a[1]:'🔒'}</span><b>${a[0]}</b></div>`).join('')}
function rCodes(){$('list').innerHTML=`<div class="code"><input id="ci" placeholder="Entre un code" maxlength="20" autocomplete="off" autocapitalize="characters" aria-label="Code"><button id="cb">Valider</button></div><div class="box">Codes utilisés : <b>${Object.keys(S.codes).length}/20</b><br>Il y en a 20 de cachés, à toi de les trouver 😉</div>`;$('cb').onclick=redeem;$('ci').onkeydown=e=>{if(e.key==='Enter')redeem()}}
function redeem(){const k=$('ci').value.trim().toUpperCase();if(!k)return;if(k==='SIMONADMIN'){S.adm=1;$('admb').hidden=false;ding(1500);openAdmin();return}const r=CODES[k];if(!r){toast('Code invalide');return}if(S.codes[k]){toast('Code déjà utilisé');return}
 S.codes[k]=1;const[t,a,b]=r;
 if(t==='c'){add(a);toast('Code validé : +'+f(a)+' pièces !')}
 else if(t==='s'){const g=Math.max(cps()*a,a*10);add(g);toast('Code validé : +'+f(g)+' pièces !')}
 else if(t==='b'){S.bm=a;S.bu=Date.now()+b*1000;toast('Boost ×'+a+' pendant '+b+' s !')}
 else{S.rp+=a;toast('Code validé : +'+a+' 💠')}
 ding(1300);rCodes();stats()}
let qty=1;
function bulk(b,r,o,n){return Math.ceil(b*Math.pow(r,o)*(Math.pow(r,n)-1)/(r-1))}
function qn(b,r,o){if(qty!=='max')return qty;let n=Math.max(1,Math.floor(Math.log(1+S.m*(r-1)/(b*Math.pow(r,o)))/Math.log(r)));while(n>1&&bulk(b,r,o,n)>S.m)n--;return n}
$('qty').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;qty=b.dataset.q==='max'?'max':+b.dataset.q;document.querySelectorAll('#qty button').forEach(x=>x.classList.toggle('on',x===b));render()});
const AD={give:n=>add(n),setm:n=>{S.m=n},rp:n=>{S.rp+=n},rbs:n=>{S.rb=Math.max(0,Math.floor(n))},fing:n=>{S.fing+=Math.floor(n)},gens:n=>GENS.forEach(g=>{S.g[g.id]=(S.g[g.id]||0)+Math.floor(n)}),am:n=>{S.am=n>0?n:1},boost:n=>{S.bm=n>0?n:1;S.bu=Date.now()+3e5},time:n=>add(cps()*n),all:()=>{UPS.forEach(u=>S.u[u.id]=1);FX.forEach(x=>S.fx[x.id]=1);SKINS.forEach(s=>S.sk[s.id]=1);ACH.forEach((a,i)=>S.ach[i]=1)},gold:()=>golden(),codes:()=>{S.codes={}}};
function openAdmin(){const a=$('adm');a.hidden=false;a.firstElementChild.innerHTML='<h2>🛠️ Panneau admin</h2><input id="ax" inputmode="decimal" placeholder="Nombre (ex. 1e9)" value="1000000" aria-label="Valeur"><div class="g">'+[['give','Donner des pièces'],['setm','Fixer les pièces'],['rp','Donner des 💠'],['rbs','Fixer les rebirths'],['fing','Ajouter des niveaux de doigt'],['gens','+N de chaque bâtiment'],['am','Multiplicateur global ×N'],['boost','Boost ×N pendant 5 min'],['time','Avancer de N secondes'],['all','Tout débloquer'],['gold','Faire apparaître 🌟'],['codes','Réinitialiser les codes']].map(x=>'<button data-a="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><button data-a="close" style="width:100%">Fermer</button>'}
$('adm').addEventListener('click',e=>{if(e.target===$('adm')){$('adm').hidden=true;return}const b=e.target.closest('button[data-a]');if(!b)return;const k=b.dataset.a;if(k==='close'){$('adm').hidden=true;return}AD[k](Number($('ax').value)||0);render();stats();toast('Appliqué ✔')});
const stage=$('stage');
function spawn(txt,x,y,cls,css){const e=document.createElement('div');e.className=cls;e.textContent=txt;e.style.left=x+'px';e.style.top=y+'px';if(css)for(const k in css)e.style.setProperty(k,css[k]);stage.appendChild(e);setTimeout(()=>e.remove(),2600)}
function click(ev){
 let v=cv();const cr=Math.random()<.05+.01*(S.pu.l||0);if(cr)v*=10;add(v);S.ck++;
 const r=stage.getBoundingClientRect();let x=r.width/2,y=r.height/2-20;
 if(ev&&ev.clientX){x=ev.clientX-r.left;y=ev.clientY-r.top}
 spawn((cr?'💥 CRIT +':'+')+f(v),x-14+Math.random()*28,y-20,'fx');
 const burst=(arr,n)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,d=60+Math.random()*80;spawn(arr[Math.floor(Math.random()*arr.length)],x,y,'bit',{'--x':Math.cos(a)*d+'px','--y':Math.sin(a)*d-30+'px','--r':(Math.random()*720-360)+'deg'})}};
 if(S.fx.f1)burst(['🎊','🎉','🟡','🟢','🔵','🟣'],6);
 if(S.fx.f3)burst(['✨','⭐','🌟'],5);
 if(S.fx.f6)burst(['🔥','🧨','☄️'],5);
 if(S.fx.f9)burst(['💸','💵','💶','💴'],5);
 if(S.fx.f10)burst(['🎆','🎇','✨','🎊'],9);
 if(S.fx.f8)coin.animate([{filter:'hue-rotate(0deg)'},{filter:'hue-rotate(360deg)'}],{duration:450});
 if(S.fx.f4){stage.animate([{transform:'translate(0,0)'},{transform:'translate(-4px,2px)'},{transform:'translate(4px,-2px)'},{transform:'translate(0,0)'}],{duration:140})}
 ding(700+Math.random()*500);
}
const coin=$('coin');
coin.addEventListener('pointerdown',e=>{coin.classList.add('p');click(e)});
['pointerup','pointerleave','pointercancel'].forEach(t=>coin.addEventListener(t,()=>coin.classList.remove('p')));
coin.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();if(!e.repeat)click()}});
coin.addEventListener('click',e=>{if(e.detail===0&&e.pointerType===undefined){}});
function items(){
 if(tab==='gen')return GENS.map(g=>{const o=S.g[g.id]||0,n=qn(g.b,1.15,o);return{k:'g:'+g.id,e:g.e,n:g.n+(n>1?' ×'+n:''),d:g.d+' · +'+f(g.c*mult('cps')*n)+'/s',c:bulk(g.b,1.15,o,n),o}});
 if(tab==='up'){const fn=qn(10,1.4,S.fing);const a=[{k:'fing',e:'👆',n:'Meilleur doigt'+(fn>1?' ×'+fn:''),d:'+'+fn+' par clic',c:bulk(10,1.4,S.fing,fn),o:S.fing}];
  UPS.forEach(u=>a.push({k:'u:'+u.id,e:u.e,n:u.n,d:u.d,c:u.p,done:!!S.u[u.id]}));return a}
 if(tab==='fx')return FX.map(x=>({k:'x:'+x.id,e:x.e,n:x.n,d:x.d,c:x.p,done:!!S.fx[x.id]}));
 return SKINS.map(s=>({k:'s:'+s.id,e:s.id,n:s.n,d:S.cur===s.id?'Équipé':S.sk[s.id]?'Débloqué – toucher pour équiper':'Change l’apparence de la pièce',c:s.p,done:!!S.sk[s.id],eq:S.cur===s.id}))
}
function render(){
 $('qty').hidden=!(tab==='gen'||tab==='up');if(tab==='rb')return rRb();if(tab==='ach')return rAch();if(tab==='code')return rCodes();
 $('list').innerHTML=items().map(i=>{const own=i.done&&!i.eq&&tab==='skin';
  return `<button class="item${i.done?' done':''}${!i.done&&S.m<i.c?' cant':''}" data-k="${i.k}" data-c="${i.c}"><span class="e">${i.e}</span><span><b>${i.n}</b><small>${i.d}</small></span><span class="c">${i.eq?'✔ Équipé':i.done?(own?'Équiper':'✔ Acheté'):f(i.c)+' 🪙'}${i.o!==undefined?`<span class="n">Possédé : ${i.o}</span>`:''}</span></button>`}).join('')}
function buy(k){
 const [t,id]=k.split(':');
 if(t==='rb'){rebirth();return}if(t==='p'){buyP(id);return}if(t==='fing'){const n=qn(10,1.4,S.fing),c=bulk(10,1.4,S.fing,n);if(S.m<c)return;S.m-=c;S.fing+=n}
 else if(t==='g'){const g=GENS.find(x=>x.id===id),o=S.g[id]||0,n=qn(g.b,1.15,o),c=bulk(g.b,1.15,o,n);if(S.m<c)return;S.m-=c;S.g[id]=o+n}
 else if(t==='u'){const u=UPS.find(x=>x.id===id);if(S.u[id]||S.m<u.p)return;S.m-=u.p;S.u[id]=1;toast(u.n+' acheté !')}
 else if(t==='x'){const x=FX.find(y=>y.id===id);if(S.fx[id]||S.m<x.p)return;S.m-=x.p;S.fx[id]=1;toast(x.n+' activé !')}
 else if(t==='s'){const s=SKINS.find(y=>y.id===id);if(!S.sk[id]){if(S.m<s.p)return;S.m-=s.p;S.sk[id]=1}S.cur=id;coin.textContent=id}
 ding(1000);render();stats()}
$('list').addEventListener('click',e=>{const b=e.target.closest('.item');if(b)buy(b.dataset.k)});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()});
function stats(){$('pc').textContent=f(cv());$('ps').textContent=f(cps());$('ck').textContent=f(S.ck);$('tt').textContent=f(S.tot);$('gc').textContent=f(S.gc);const b=$('bst');if(bm()>1){b.hidden=false;b.textContent='🔥 Boost ×'+bm()+' · '+Math.ceil((S.bu-Date.now())/1000)+' s'}else b.hidden=true;checkAch()}
let last=performance.now(),acc=0,rainT=0;
function loop(now){
 const dt=Math.min(now-last,1000)/1000;last=now;
 add(cps()*dt);$('money').textContent=f(S.m);
 acc+=dt;if(acc>.25){acc=0;stats();document.querySelectorAll('.item:not(.pit)').forEach(b=>{if(!b.classList.contains('done'))b.classList.toggle('cant',S.m<+b.dataset.c)})}
 const rn=[S.fx.f2&&'🪙',S.fx.f7&&'❄️',S.fx.f11&&'🌸'].filter(Boolean);if(rn.length){rainT+=dt;if(rainT>.35/rn.length){rainT=0;spawn(rn[Math.floor(Math.random()*rn.length)],Math.random()*(stage.clientWidth-20),0,'rain')}}
 requestAnimationFrame(loop)}
let gEl=null;
function goldenSoon(){const lucky=S.u.u7?.5:1;setTimeout(()=>{golden();goldenSoon()},(25000+Math.random()*35000)*lucky)}
function golden(){if(gEl||document.hidden)return;const e=document.createElement('button');e.id='gold';e.textContent='🌟';e.setAttribute('aria-label','Pièce dorée, cliquer pour un gros bonus');
 e.style.left=(10+Math.random()*(stage.clientWidth-70))+'px';e.style.top=(60+Math.random()*(stage.clientHeight-120))+'px';
 e.onclick=()=>{const b=Math.max(cps()*60,cv()*100);add(b);S.gc++;toast('Pièce dorée ! +'+f(b));ding(1500);e.remove();gEl=null;stats()};
 stage.appendChild(e);gEl=e;setTimeout(()=>{if(gEl===e){e.remove();gEl=null}},9000)}
function save(){S.t=Date.now();try{localStorage.setItem('piece-dor-v1',JSON.stringify(S));$('save').textContent='Sauvegardé ✔'}catch(e){$('save').textContent='Sauvegarde indisponible'}}
$('reset').onclick=()=>{if(confirm('Tout effacer et recommencer ?')){S=def();try{localStorage.removeItem('piece-dor-v1')}catch(e){}coin.textContent='🪙';render();stats()}};
setInterval(save,5000);addEventListener('beforeunload',save);
// gains hors ligne (50 % de la production, 2 h max)
const away=Math.min((Date.now()-S.t)/1000,7200);
if(away>60&&cps()>0){const g=cps()*away*.5;add(g);setTimeout(()=>toast('Pendant ton absence : +'+f(g)+' pièces'),600)}
const today=new Date().toDateString();if(S.day!==today){S.day=today;const d=Math.max(cps()*600,1000);add(d);setTimeout(()=>toast('Bonus du jour : +'+f(d)+' pièces 🎁'),1500)}
$('admb').hidden=!S.adm;$('admb').onclick=openAdmin;
coin.textContent=S.cur;render();stats();goldenSoon();requestAnimationFrame(loop);
</script>
</body>
</html>
